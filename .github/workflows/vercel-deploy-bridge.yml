# Deploy Aztec Bridge to Vercel.
# Single workflow, one project (aztec-bridge), branch selects the target:
#   main    → Preview build, then Production (--prod)
#   testnet → the `testnet` Vercel Custom Environment (--target=testnet), which
#             scopes the deploy so it can never touch the mainnet production domain.
# Per-job env blocks below supply the network-specific DATABASE_URL / JWT / RPC used
# by the prisma db push and manual Next build; Vercel-side env vars (pulled by
# `vercel build`) drive the deployed artifact's network selection.
name: Deploy Aztec Bridge to Vercel
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_AZTEC_BRIDGE_PROJECT_ID }}
  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
  NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
  NEXT_PUBLIC_DATADOG_APPLICATION_ID: ${{ secrets.NEXT_PUBLIC_DATADOG_APPLICATION_ID }}
  NEXT_PUBLIC_DATADOG_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_DATADOG_CLIENT_TOKEN }}
  NEXT_PUBLIC_DATADOG_SITE: ${{ secrets.NEXT_PUBLIC_DATADOG_SITE }}
  NEXT_PUBLIC_DATADOG_SERVICE: ${{ secrets.NEXT_PUBLIC_DATADOG_SERVICE }}
  NEXT_PUBLIC_DATADOG_LOGS_CLIENT_TOKEN: ${{ secrets.NEXT_PUBLIC_DATADOG_LOGS_CLIENT_TOKEN }}

on:
  push:
    branches:
      - main
      - testnet

jobs:
  # Every deploy job below waits on this one. `needs:` cannot cross workflow files,
  # so the suite is called in-run rather than left to race the deploy on its own
  # push trigger — which is what it did before, letting production go live while
  # its tests were still running, and stay live when they failed.
  tests:
    uses: ./.github/workflows/tests.yml

  Deploy-Preview:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref_name == 'main'
    env:
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      ETHEREUM_RPC_URL_2: ${{ secrets.ETHEREUM_RPC_URL_2 }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_DATADOG_ENV: ${{ secrets.NEXT_PUBLIC_DATADOG_ENV }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-pnpm-and-install
        with:
          working-directory: .

      - name: Build SDK
        working-directory: ./packages/sdk
        run: pnpm build

      - name: Sync DB schema
        working-directory: ./frontend
        run: pnpm exec prisma db push --skip-generate

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Design lint (SOP — blocks on contrast/opacity)
        working-directory: ./frontend
        run: pnpm design-lint

      - name: Build Next App
        working-directory: ./frontend
        run: pnpm build

      - name: Pull Preview Environment From Vercel
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  Deploy-Production:
    permissions: write-all
    runs-on: ubuntu-latest
    environment: Production
    if: github.ref_name == 'main'
    needs: Deploy-Preview
    env:
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      ETHEREUM_RPC_URL_2: ${{ secrets.ETHEREUM_RPC_URL_2 }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_DATADOG_ENV: ${{ secrets.NEXT_PUBLIC_DATADOG_ENV }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-pnpm-and-install
        with:
          working-directory: .

      - name: Build SDK
        working-directory: ./packages/sdk
        run: pnpm build

      - name: Sync DB schema
        working-directory: ./frontend
        run: pnpm exec prisma db push --skip-generate

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Design lint (SOP — blocks on contrast/opacity)
        working-directory: ./frontend
        run: pnpm design-lint

      - name: Build Next App
        working-directory: ./frontend
        run: pnpm build

      - name: Pull Production Environment From Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        run: vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  Deploy-Testnet:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref_name == 'testnet'
    env:
      ETHEREUM_RPC_URL: ${{ secrets.TESTNET_ETHEREUM_RPC_URL }}
      JWT_SECRET: ${{ secrets.TESTNET_JWT_SECRET }}
      NEXT_PUBLIC_DATADOG_ENV: testnet
      DATABASE_URL: ${{ secrets.TESTNET_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-pnpm-and-install
        with:
          working-directory: .

      - name: Build SDK
        working-directory: ./packages/sdk
        run: pnpm build

      - name: Sync DB schema
        working-directory: ./frontend
        run: pnpm exec prisma db push --skip-generate

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Design lint (SOP — blocks on contrast/opacity)
        working-directory: ./frontend
        run: pnpm design-lint

      - name: Build Next App
        working-directory: ./frontend
        run: pnpm build

      - name: Pull Testnet Environment From Vercel
        run: vercel pull --yes --environment=testnet --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --target=testnet --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Testnet Environment
        run: vercel deploy --target=testnet --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
